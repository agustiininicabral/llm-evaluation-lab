name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Check formatting
        if: matrix.python-version == '3.12'
        run: ruff format --check .
      - name: Check lint
        if: matrix.python-version == '3.12'
        run: ruff check .
      - name: Smoke-test CLI
        if: matrix.python-version == '3.12'
        run: |
          llm-eval evaluate examples/rag_cases.json --out-dir /tmp/llm-eval-report
          llm-eval safety examples/safety_cases.json --out-dir /tmp/llm-eval-safety
      - name: Upload example reports
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: llm-evaluation-reports
          path: |
            /tmp/llm-eval-report/
            /tmp/llm-eval-safety/
          if-no-files-found: warn
